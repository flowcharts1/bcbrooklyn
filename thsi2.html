<!DOCTYPE html>
<html>
<body>
<div id="otp"></div>

<script>
const base32chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";

function base32ToBytes(base32) {
  let bits = "";
  
  base32 = base32
    .replace(/=+$/, "")
    .toUpperCase();

  for (const char of base32) {
    const val = base32chars.indexOf(char);
    if (val === -1) {
      throw new Error("Invalid Base32 character: " + char);
    }

    bits += val.toString(2).padStart(5, "0");
  }

  const bytes = [];

  for (let i = 0; i + 8 <= bits.length; i += 8) {
    bytes.push(parseInt(bits.substring(i, i + 8), 2));
  }

  return new Uint8Array(bytes);
}

async function generateTOTP(secretBytes, digits = 6, period = 30) {
  const epoch = Math.floor(Date.now() / 1000);
  const counter = Math.floor(epoch / period);

  const counterBuffer = new ArrayBuffer(8);
  const view = new DataView(counterBuffer);

  // big-endian counter
  view.setUint32(4, counter);

  const cryptoKey = await crypto.subtle.importKey(
    "raw",
    secretBytes,
    {
      name: "HMAC",
      hash: "SHA-1"
    },
    false,
    ["sign"]
  );

  const hmac = await crypto.subtle.sign(
    "HMAC",
    cryptoKey,
    counterBuffer
  );

  const hash = new Uint8Array(hmac);

  const offset = hash[hash.length - 1] & 0x0f;

  const binary =
    ((hash[offset] & 0x7f) << 24) |
    ((hash[offset + 1] & 0xff) << 16) |
    ((hash[offset + 2] & 0xff) << 8) |
    (hash[offset + 3] & 0xff);

  const otp = (binary % (10 ** digits))
    .toString()
    .padStart(digits, "0");

  return otp;
}

const secret = "373BW7ZZ45KHRIFD";
const secretBytes = base32ToBytes(secret);

async function update() {
  const otp = await generateTOTP(secretBytes);
  document.getElementById("otp").textContent = otp;
}

update();
setInterval(update, 1000);
</script>
</body>
</html>
